[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch-id"
version = "0.3.0"
description = "Vouch: a portable handle you own, login with it, and signed statements anyone can check offline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=49.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ao3575911/vouch-id"
Repository = "https://github.com/ao3575911/vouch-id"
Issues = "https://github.com/ao3575911/vouch-id/issues"
Changelog = "https://github.com/ao3575911/vouch-id/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.4",
]
qr = [
    "segno>=1.6",
]

[project.scripts]
vouch-id = "vouch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
