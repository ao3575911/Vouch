name: tag-version
run-name: tag-version @ ${{ github.sha }}

on:
  push:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tags
        id: meta
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          version = data['project']['version']
          with open('tag-metadata.txt', 'w', encoding='utf-8') as f:
              f.write(f"VERSION={version}\n")
          PY

          VERSION=$(grep '^VERSION=' tag-metadata.txt | cut -d= -f2)
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create and push tags
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.meta.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$SHA_TAG" -m "Trace tag for commit ${GITHUB_SHA}"
          git tag -a "$VERSION_TAG" -m "Version trace tag ${VERSION_TAG} for commit ${GITHUB_SHA}"

          git push origin "$SHA_TAG"
          git push origin "$VERSION_TAG"
