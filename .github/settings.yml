repository:
  name: Vouch
  description: "Vouch: your name, your key, your proof — local-first identity with signed proofs, auditable logs, and strict capability gating."
  default_branch: main
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - ci
      enforce_admins: true
      restrictions: null
