repository:
  name: vouch-id
  description: "ID you carry, not ID they control. Offline proof, no account, no kill switch."
  default_branch: main
  topics: "identity, did, self-sovereign-identity, oidc, ed25519, offline-verification, security, python, privacy"
  has_issues: true
  has_projects: true
  has_wiki: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# main is protected by the "main protection" ruleset, not classic branch
# protection. This block mirrors it: PR required, 0 approvals, no code-owner
# review, strict `test` check, no bypass.
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - test
      enforce_admins: true
      restrictions: null

